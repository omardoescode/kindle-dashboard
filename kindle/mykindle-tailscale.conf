description "Tailscale (userspace) for mykindle"
start on framework_ready
respawn
respawn limit 5 120
script
  D=/mnt/us/tailscale
  i=0
  until $D/tailscaled --version >/dev/null 2>&1; do
    i=$((i+1)); [ $i -gt 60 ] && exit 1
    sleep 5
  done
  # No log upload, and no log on the flash storage (it grew ~8 MB a day).
  exec $D/tailscaled --no-logs-no-support --tun=userspace-networking --statedir=$D/state --socket=/var/tmp/tailscaled.sock --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1055 >/dev/null 2>&1
end script
