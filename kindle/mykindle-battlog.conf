description "Battery log for mykindle: one CSV line every 10 min"
start on framework_ready
respawn
respawn limit 5 120
script
  B=/sys/class/power_supply/bd71827_bat
  L=/mnt/us/battlog.csv
  [ -f $L ] || echo "time,capacity,charge_now,current_now,charging,fl_intensity,suspends" > $L
  # The loop stops while the Kindle sleeps, so a gap longer than 10 min in the log is time asleep.
  while true; do
    echo "$(date +%s),$(cat $B/capacity),$(cat $B/charge_now),$(cat $B/current_now),$(cat $B/charging),$(lipc-get-prop com.lab126.powerd flIntensity 2>/dev/null),$(cat /sys/power/suspend_stats/success 2>/dev/null)" >> $L
    sleep 600
  done
end script
