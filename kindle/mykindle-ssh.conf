description "Localhost SSH for mykindle (reached over Tailscale)"
start on framework_ready
respawn
respawn limit 5 120
script
  B=/mnt/us/jobman/bin/dropbearmulti
  i=0
  until [ -x $B ] && $B dropbear -V >/dev/null 2>&1; do
    i=$((i+1)); [ $i -gt 60 ] && exit 1
    sleep 5
  done
  exec $B dropbear -F -R -H/mnt/us -p127.0.0.1:2222 -s
end script
