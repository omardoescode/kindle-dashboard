description "mykindle: start KOReader without the Amazon UI, once per boot"
start on framework_ready
task
script
  [ -e /var/run/mykindle-ko-booted ] && exit 0
  touch /var/run/mykindle-ko-booted
  [ -e /mnt/us/NO_KOREADER_BOOT ] && exit 0
  [ -x /mnt/us/koreader/koreader.sh ] || exit 0
  sleep 15
  cd /mnt/us/koreader
  setsid ./koreader.sh --framework_stop </dev/null >/var/tmp/mykindle-ko-boot.log 2>&1 &
end script
